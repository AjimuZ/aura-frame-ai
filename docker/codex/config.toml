# Codex CLI config of the opt-in sidecar: turns off every capability the comparison job does not need.
# Must match the TOML in docs/ai-providers.md (tests/codex-sidecar.test.cjs). The entrypoint copies it into the
# Codex home on every start, so an older or edited copy in the codex-home volume never applies.
web_search = "disabled"
history.persistence = "none"
analytics.enabled = false
feedback.enabled = false
otel.exporter = "none"
otel.trace_exporter = "none"
otel.metrics_exporter = "none"     # the upstream default is "statsig"

[features]
shell_tool = false
