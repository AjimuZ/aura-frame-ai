# Reverse proxy in front of the API: refuses foreign Host headers, and otherwise forwards everything.
# The session token is checked by the API. All writable paths are under the /tmp tmpfs.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  server_tokens off;
  # Request lines carry library and photo IDs, and nothing here needs them.
  access_log off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  client_max_body_size 8m;

  # Docker's DNS. `api` is recreated when the chosen folder changes, and its address can change with it,
  # so the name is resolved per request through a variable instead of once at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Any Host not named below lands here. This is what stops DNS rebinding at the published port.
  server {
    listen 8080 default_server;
    return 403;
  }

  server {
    listen 8080;
    server_name 127.0.0.1 localhost;

    location / {
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      # Server-sent events must reach the client as they happen, and a run can stay quiet for a while.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }

  # Container health check only: bound to loopback, so it is not reachable through the published port.
  server {
    listen 127.0.0.1:8081;

    location = /healthz {
      return 200;
    }
  }
}
